name: composer-services-mysql-smoke

steps:
  - packages:
      install: [redis]

  - composer:
      auth:
        - host: packages.smoke.invalid
          username: smoke-user
          password: smoke-password
      packages:
        - psr/log: "^3.0"

  - service: redis

  - mysql:
      databases: [smoke_app, smoke_test]
