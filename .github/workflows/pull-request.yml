name: Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build, and smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            target: bun-linux-x64
            binary: dev-linux-x64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin
            target: bun-darwin-x64
            binary: dev-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - name: Build native binary
        run: bun run manifest && bun build src/main.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.binary }}
      - name: Normalize Linux integration runner
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get purge -y redis-server redis-tools
          sudo systemctl stop apache2 nginx || true
      - name: Start Docker on macOS
        if: matrix.platform == 'darwin'
        run: |
          brew install docker colima
          colima start --cpu 2 --memory 4 --disk 20
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
      - name: Run smoke scenarios
        run: bash tests/smoke/run.sh "$PWD/dist/${{ matrix.binary }}" ${{ matrix.platform }}
